name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-check:
    name: Run dependency and secret scanning gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Run security checks
        run: npm run security-check
