name: Check audio coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-audio-coverage:
    name: Run audio coverage check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install node dependencies
        run: npm ci

      - name: Run audio coverage check
        run: npm run check-audio-coverage
